name: Build Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller --noconsole --onefile --name "Italia2088" --paths=src --add-data "assets;assets" --add-data "src;src" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/Italia2088.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build Single Executable (Mac)
        run: |
          pyinstaller --noconsole --onefile --name "Italia2088" --paths=src --add-data "assets:assets" --add-data "src:src" main.py
          chmod +x dist/Italia2088
          cd dist && zip -r Italia2088-Mac.zip Italia2088

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/Italia2088-Mac.zip